<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rnmd Store</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: white;
        }

        header {
            background-color: #0D5975;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: #00E9F6;
            font-size: 24px;
        }

        .menu-toggle {
            display: none;
        }

        .banner {
            text-align: center;
            margin: 20px;
        }

        .banner img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .category-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .category-buttons button {
            background-color: #3D8F9F;
            border: none;
            color: white;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .category-buttons button:hover {
            background-color: #00E9F6;
        }

        .popular-section {
            text-align: center;
            margin: 20px 0;
        }

        .popular-section h2 {
            font-size: 24px;
        }

        .fire-emoji {
            font-size: 30px;
            color: #FF4500;
        }

        @media (max-width: 768px) {
            .category-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Rnmd Store</h1>
    </header>

    <div class="banner">
        <img src="https://via.placeholder.com/800x300" alt="Rnmd Store Banner">
    </div>

    <div class="category-buttons">
        <button>Pulsa Reguler</button>
        <button>PLN</button>
        <button>E-Money</button>
        <button>Paket SMS & Telpon</button>
        <button>Games</button>
        <button>Voucher</button>
        <button>Pulsa Transfer</button>
        <button>Data Internet</button>
        <button>Akun Premium</button>
        <button>TV</button>
        <button>Masa Aktif</button>
        <button>Streaming</button>
    </div>

    <div class="popular-section">
        <h2><span class="fire-emoji">🔥</span> Populer</h2>
    </div>

</body>
</html>
